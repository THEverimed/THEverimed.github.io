<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Verimed — الدفع</title>
  <meta name="theme-color" content="#2E7D7B">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.15.0/moyasar.css">
  <script src="https://cdn.moyasar.com/mpf/1.15.0/moyasar.js"></script>
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --p: #2E7D7B; --ink: #132026; --muted: #5B6B72; --line: #E3E8EA; --bg: #F6F7F7; --ok: #1E8E5A; --bad: #C0392B; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: Tajawal, system-ui, sans-serif;
      display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px 60px; }
    .card { width: 100%; max-width: 440px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 26px 22px; box-shadow: 0 10px 30px rgba(19,32,38,.06); }
    .brand { display: flex; justify-content: center; margin: 2px 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .brand svg { display: block; }
    .sum { background: #F1F7F7; border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; margin: 4px 0; }
    .amount { font-size: 26px; font-weight: 800; color: var(--p); }
    .muted { color: var(--muted); font-size: 13px; }
    .center { text-align: center; }
    .icon { font-size: 46px; margin: 8px 0; }
    h1 { font-size: 21px; margin: 6px 0 8px; }
    .btn { display: inline-block; background: var(--p); color: #fff; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-weight: 700; margin-top: 16px; }
    .secure { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; }
    .mysr-form { direction: ltr; }
    .spin { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--p); border-radius: 50%; animation: s 1s linear infinite; margin: 20px auto; }
    @keyframes s { to { transform: rotate(360deg); } }
    .sk { border-radius: 14px; background: linear-gradient(90deg, #EEF2F2 25%, #F7F9F9 50%, #EEF2F2 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
    .sk1 { height: 78px; margin-bottom: 16px; } .sk2 { height: 46px; margin-bottom: 10px; } .sk3 { height: 150px; }
    @keyframes sh { to { background-position: -200% 0; } }
  </style>
</head>
<body>

-29.9H11.3V-26.3Q12.7 -28.2 15 -29.3Q17.3 -30.4 20.1 -30.4Q23.6 -30.4 26.4 -28.9Q29.1 -27.4 30.6 -24.6Q32.1 -27.2 34.9 -28.8Q37.6 -30.4 40.9 -30.4Q46.4 -30.4 49.8 -27Q53.1 -23.6 53.1 -17.6Z M87.9 -12.7H66Q66.3 -9.4 68.3 -7.6Q70.3 -5.8 73.2 -5.8Q77.4 -5.8 79.2 -9.4H87.4Q86.1 -5.1 82.4 -2.3Q78.7 0.5 73.4 0.5Q69.1 0.5 65.6 -1.4Q62.2 -3.4 60.3 -6.9Q58.4 -10.4 58.4 -15Q58.4 -19.6 60.3 -23.1Q62.1 -26.6 65.6 -28.5Q69 -30.4 73.4 -30.4Q77.7 -30.4 81 -28.6Q84.4 -26.7 86.3 -23.4Q88.1 -20 88.1 -15.6Q88.1 -14 87.9 -12.7ZM80.3 -17.8Q80.2 -20.7 78.2 -22.4Q76.1 -24.2 73.2 -24.2Q70.4 -24.2 68.4 -22.5Q66.5 -20.8 66.1 -17.8Z M105.4 -30.4Q108.3 -30.4 111 -29.1Q113.6 -27.9 115.2 -25.8V-40H122.8V0H115.2V-4.4Q113.8 -2.2 111.2 -0.9Q108.7 0.5 105.3 0.5Q101.6 0.5 98.4 -1.5Q95.3 -3.4 93.5 -6.9Q91.7 -10.5 91.7 -15.1Q91.7 -19.6 93.5 -23.1Q95.3 -26.6 98.4 -28.5Q101.6 -30.4 105.4 -30.4ZM107.3 -23.8Q105.2 -23.8 103.4 -22.7Q101.6 -21.7 100.5 -19.7Q99.4 -17.8 99.4 -15.1Q99.4 -12.4 100.5 -10.3Q101.6 -8.3 103.4 -7.2Q105.2 -6.2 107.3 -6.2Q109.4 -6.2 111.2 -7.2Q113.1 -8.3 114.2 -10.2Q115.2 -12.2 115.2 -15Q115.2 -17.7 114.2 -19.7Q113.1 -21.6 111.2 -22.7Q109.4 -23.8 107.3 -23.8Z" fill="#2D3A4A"/></svg></div>
    <div id="view"><div class="sk sk1"></div><div class="sk sk2"></div><div class="sk sk3"></div><p class="center muted" style="margin-top:14px">نجهّز صفحة الدفع…</p></div>
  </div>

<script>
(function () {
  var API = window.VERIMED_API;
  var view = document.getElementById('view');
  var q = new URLSearchParams(location.search);
  var intentId = q.get('i') || '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function api(action, payload) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: payload }) })
      .then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, error: 'تعذر الاتصال — تأكدي من الإنترنت وحدّثي الصفحة' }; });
  }

  function msg(icon, title, text, withBtn) {
    view.innerHTML = '<div class="center"><div class="icon">' + icon + '</div><h1>' + esc(title) + '</h1><p class="muted">' + esc(text) + '</p>' +
      (withBtn ? '<a class="btn" href="https://verimed.app/#/account">الرجوع للمنصة</a>' : '') + '</div>';
  }

  if (!API) return msg('⚠️', 'خطأ في الإعداد', 'ملف config.js ناقص', false);
  if (!intentId) return msg('⚠️', 'رابط غير صحيح', 'ارجع لصفحة الباقات واضغط اشترك مرة ثانية', true);

  // ═══ بعد الرجوع من الدفع ═══
  if (q.get('done') === '1') {
    var payId = q.get('id') || '';
    if (!payId) return msg('❌', 'لم تكتمل عملية الدفع', q.get('message') || 'ما انخصم منك شيء — جرّب مرة ثانية', true);
    view.innerHTML = '<div class="spin"></div><p class="center muted">نتحقق من الدفع… لا تسكّر الصفحة</p>';
    return api('confirmPayment', { i: intentId, id: payId }).then(function (r) {
      if (r.ok) {
        msg('✅', 'تم تفعيل اشتراكك', 'أسئلتك صارت غير محدودة طوال مدة الباقة — بالتوفيق في اختبارك', true);
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
      } else if (r.code === 'PAY_FAILED') {
        msg('❌', 'لم تتم عملية الدفع', r.error || 'جرّب بطاقة ثانية', true);
      } else {
        msg('⏳', 'ما قدرنا نتأكد الحين', (r.error || '') + ' — لا تدفع مرة ثانية. لو ما تفعّلت باقتك خلال دقائق تواصل مع الدعم: t.me/Verimed_App_bot', true);
      }
    });
  }

  // ═══ صفحة الدفع ═══
  api('paymentIntent', { i: intentId }).then(function (r) {
    if (!r.ok) return msg('⚠️', 'تعذر فتح الدفع', r.error, true);
    var d = r.data;
    if (d.paid) return msg('✅', 'هذا الطلب مدفوع مسبقاً', 'باقتك مفعّلة', true);

    view.innerHTML =
      '<div class="sum">' +
        '<div class="row"><b>' + esc(d.title || 'اشتراك Verimed') + '</b>' + (d.days ? '<span class="muted">' + d.days + ' يوم</span>' : '') + '</div>' +
        '<div class="row"><span class="muted">أسئلة غير محدودة</span><span class="amount">' + (d.amount / 100).toFixed(2).replace(/\.00$/, '') + ' <small style="font-size:14px">ر.س</small></span></div>' +
      '</div>' +
      '<div class="mysr-form"></div>' +
      '<div class="secure muted" style="margin-top:12px">بالدفع أنت توافق على <a href="https://verimed.app/#/terms" target="_blank" style="color:var(--p);font-weight:700">الشروط وسياسة الاسترجاع</a></div>' +
      '<div class="secure muted">🔒 الدفع آمن ومشفّر عبر ميسر — بيانات بطاقتك ما توصل لنا</div>' +
      '<div class="secure muted"><a href="https://eauthenticate.saudibusiness.gov.sa/inquiry" target="_blank" rel="noopener" style="color:var(--ok)">✔ موثّق في المركز السعودي للأعمال — رقم التوثيق 0000346279</a></div>';

    Moyasar.init({
      element: '.mysr-form',
      amount: d.amount,
      currency: 'SAR',
      description: d.description,
      publishable_api_key: d.publishableKey,
      callback_url: d.callbackUrl,
      methods: ['applepay', 'creditcard'],          // Apple Pay يطلع بس على أجهزة أبل (سفاري)، والباقي يشوفون البطاقة
      supported_networks: ['mada', 'visa', 'mastercard'],
      apple_pay: {
        country: 'SA',
        label: 'Verimed',
        validate_merchant_url: 'https://api.moyasar.com/v1/applepay/initiate'
      },
      language: 'ar',
      metadata: { intent_id: d.intentId }
    });
  });
})();
</script>
</body>
</html>
