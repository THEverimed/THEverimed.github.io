<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Verimed — الإجابة الموثوقة لاختبار SMLE</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #F8FAF9; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
  <script>
    // إلغاء أي كاش قديم في المتصفح فوراً
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    }
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
  </script>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbz3mHc5Am82iLeSYIT_OAeVEaE8LRYUR6HD6G0mP0FL_Mx8uBPFyvST95Mb4pr09cTkpw/exec" allow="clipboard-read; clipboard-write"></iframe>
</body>
</html>
