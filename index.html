<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verimed — الإجابة الموثوقة لاختبار SMLE</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E7D7B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --primary:#2E7D7B;--primary-hover:#246361;--primary-soft:rgba(46,125,123,.09);
  --navy:#2D3A4A;--bg:#F8FAF9;--surface:#FFF;--surface-2:#F1F5F4;
  --text:#22292F;--muted:#5C6A79;--line:#E2E8E6;
  --ok:#1F8A70;--ok-soft:#E8F7F2;--bad:#D9534F;--bad-soft:#FDEEEE;
  --r:18px;--r-sm:12px;--pill:9999px;
  --font:'Readex Pro',system-ui,-apple-system,sans-serif;
  --shadow:0 4px 20px rgba(0,0,0,.04);--shadow-up:0 12px 32px rgba(46,125,123,.08);
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111720;--surface:#18212D;--surface-2:#222D3B;
    --text:#EDF2F7;--muted:#8C9BAE;--line:#283546;
    --primary-soft:rgba(46,125,123,.18);
    --shadow:0 4px 20px rgba(0,0,0,.3);--shadow-up:0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#111720;--surface:#18212D;--surface-2:#222D3B;
  --text:#EDF2F7;--muted:#8C9BAE;--line:#283546;
  --primary-soft:rgba(46,125,123,.18);
  --shadow:0 4px 20px rgba(0,0,0,.3);--shadow-up:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.65;direction:rtl}
a{color:var(--primary);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.narrow{max-width:480px}
.ltr{direction:ltr;text-align:left}

/* الهيدر */
.top{position:sticky;top:0;z-index:90;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:64px}
.top .wrap{display:flex;align-items:center;height:100%;gap:12px}
.brand img{height:32px;width:auto;display:block}
.logo-dark{display:none}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo-light{display:none}
  :root:not([data-theme="light"]) .logo-dark{display:block}
}
.grow{flex:1}
nav.topnav{display:flex;align-items:center;gap:6px}
nav.topnav a{padding:8px 14px;border-radius:var(--pill);color:var(--text);font-weight:500;font-size:14px;transition:all .2s var(--ease)}
nav.topnav a:hover,nav.topnav a.on{background:var(--surface-2);color:var(--primary)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:all .2s var(--ease)}
.icon-btn:hover{background:var(--surface-2);transform:scale(1.04)}

/* العناصر التفاعلية */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--pill);border:0;font-weight:600;font-size:14.5px;cursor:pointer;transition:all .2s var(--ease)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);box-shadow:0 6px 18px rgba(46,125,123,.28);transform:translateY(-1px)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.soft:hover{background:var(--surface-2)}
.btn.sm{padding:7px 15px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.card.lift{transition:all .25s var(--ease)}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--pill);font-size:13px;font-weight:600;background:var(--primary-soft);color:var(--primary)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}

/* الحقول */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field span{font-size:13.5px;font-weight:600;color:var(--text)}
.input{width:100%;padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none;transition:border-color .2s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13.5px;cursor:pointer;white-space:nowrap;transition:all .2s var(--ease)}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.chip.sm{padding:6px 13px;font-size:12.5px}

/* صفحة اسأل */
.pulse-ring{position:relative;display:inline-block}
.pulse-ring::before{content:"";position:absolute;inset:-8px;border-radius:26px;border:2px solid var(--primary);animation:pulse 1.8s infinite}
@keyframes pulse{0%{opacity:1;transform:scale(0.95)}50%{opacity:0.25;transform:scale(1.08)}100%{opacity:1;transform:scale(0.95)}}
.tbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
.tbl th,.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right}
.tbl th{color:var(--primary);font-weight:600}
.pearl-box{background:var(--primary-soft);border:1px solid rgba(46,125,123,.22);border-radius:14px;padding:16px 18px;margin-top:16px}
.clue-box{background:var(--surface-2);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:14px;border-right:3px solid var(--primary)}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* النوافذ والـ Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px 32px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s var(--ease)}
.modal-overlay.open .modal-sheet{transform:none}
@media (min-width:700px){
  .modal-overlay{align-items:center;padding:20px}
  .modal-sheet{border-radius:22px;transform:scale(0.95)}
  .modal-overlay.open .modal-sheet{transform:scale(1)}
}

/* الفوتر والتبويب */
footer{padding:48px 0 64px;border-top:1px solid var(--line);margin-top:72px;font-size:13.5px;color:var(--muted);text-align:center}
footer a{color:var(--muted);margin:0 8px}
footer a:hover{color:var(--primary)}
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:80;justify-content:space-around;align-items:center}
@media (max-width:760px){
  nav.topnav{display:none}
  .tabbar{display:flex}
  main{padding-bottom:80px}
}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500}
.tabbar a.on{color:var(--primary);font-weight:600}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 20px;border-radius:var(--pill);background:#2D3A4A;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .25s var(--ease)}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Verimed">
      <img class="logo-light" src="logo.svg" alt="Verimed">
      <img class="logo-dark" src="logo-dark.svg" alt="Verimed">
    </a>
    <div class="grow"></div>
    <nav class="topnav" id="topNav"></nav>
    <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <div id="topAction"></div>
  </div>
</header>

<main id="app" class="wrap" style="padding-top:28px"></main>

<nav class="tabbar" id="tabBar"></nav>
<div class="toasts" id="toasts"></div>

<!-- نافذة السيناريو The Case Scenario -->
<div class="modal-overlay" id="scenarioModal">
  <div class="modal-sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="badge" id="modalBankName" style="font-size:14px">بنك الأسئلة</div>
      <button class="icon-btn" id="closeModalBtn" style="width:34px;height:34px">✕</button>
    </div>
    <h3 style="margin-bottom:10px;font-size:16px;color:var(--text)">نص الحالة والخيارات من البنك:</h3>
    <div class="card" id="modalScenarioText" style="background:var(--surface-2);font-family:Inter,sans-serif;direction:ltr;text-align:left;line-height:1.7;margin-bottom:14px"></div>
    <div class="clue-box" id="modalClueBox"></div>
    <button class="btn primary block" id="closeModalBtn2" style="margin-top:14px">إغلاق</button>
  </div>
</div>

<script>
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return localStorage.getItem(k); } },
  set: (k,v) => localStorage.setItem(k, typeof v==='object'?JSON.stringify(v):v),
  del: k => localStorage.removeItem(k)
};
const S = { boot: null, token: store.get('vm_token') };
const API = window.VERIMED_API || '';
const fmt = n => Number(n || 0).toLocaleString('en-US');
const user = () => (S.boot && S.boot.user) || null;
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg, type=''){
  const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

async function api(action, payload={}){
  if (!API) return { ok:false, error:'رابط الخادم غير مضبوط في config.js' };
  try {
    const res = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload, payload, token: S.token || '' })
    });
    return await res.json();
  } catch(e) {
    return { ok:false, error:'تعذر الاتصال بالخادم، تحقق من اتصالك بالإنترنت' };
  }
}

function applyTheme(){
  const t = store.get('vm_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
}
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const nxt = cur === 'dark' ? 'light' : 'dark';
  store.set('vm_theme', nxt);
  applyTheme();
};
applyTheme();

const ROUTES = {
  '': viewHome,
  'ask': viewAsk,
  'pricing': viewPricing,
  'login': viewLogin,
  'register': viewRegister,
  'verify': viewVerify,
  'forgot': viewForgot,
  'account': viewAccount
};

function render(){
  const path = (location.hash.replace(/^#\/?/, '').split('?')[0]) || '';
  const u = user();
  if (['ask', 'account'].includes(path) && !u) {
    store.set('vm_after_login', '#/' + path);
    return location.hash = '#/login';
  }
  const viewFn = ROUTES[path] || viewHome;
  $('#app').innerHTML = viewFn();
  updateChrome(path);
  bindView(path);
  window.scrollTo(0,0);
}
window.onhashchange = render;

function updateChrome(path){
  const u = user();
  $('#topNav').innerHTML = u
    ? `<a href="#/" class="${path===''?'on':''}">الرئيسية</a><a href="#/ask" class="${path==='ask'?'on':''}">اسأل</a><a href="#/pricing" class="${path==='pricing'?'on':''}">الباقات</a><a href="#/account" class="${path==='account'?'on':''}">حسابي</a>`
    : `<a href="#/" class="${path===''?'on':''}">الرئيسية</a><a href="#/pricing" class="${path==='pricing'?'on':''}">الباقات</a>`;

  $('#topAction').innerHTML = u
    ? `<a class="btn sm soft" href="#/account" style="padding:6px 12px">رصيدك: ${fmt(S.boot?.balance?.usable || 0)}</a>`
    : `<a class="btn sm primary" href="#/login">دخول</a>`;

  $('#tabBar').innerHTML = u
    ? `<a href="#/" class="${path===''?'on':''}">🏠<span>الرئيسية</span></a>
       <a href="#/ask" class="${path==='ask'?'on':''}">🩺<span>اسأل</span></a>
       <a href="#/pricing" class="${path==='pricing'?'on':''}">🏷️<span>الباقات</span></a>
       <a href="#/account" class="${path==='account'?'on':''}">👤<span>حسابي</span></a>`
    : `<a href="#/" class="${path===''?'on':''}">🏠<span>الرئيسية</span></a>
       <a href="#/pricing" class="${path==='pricing'?'on':''}">🏷️<span>الباقات</span></a>
       <a href="#/login" class="${path==='login'?'on':''}">🔑<span>دخول</span></a>`;
}

function viewHome(){
  const u = user();
  return `<div style="text-align:center;padding:32px 0 20px">
    <div class="badge" style="margin-bottom:14px">The Verified Answer — المنصة السريرية الأولى</div>
    <h1 style="font-size:32px;color:var(--primary);margin-bottom:12px">الإجابة الموثوقة لاختبار SMLE</h1>
    <p style="color:var(--muted);max-width:580px;margin:0 auto 24px;font-size:16px">محرك ذكي يقارن بين مراجع UpToDate و Toronto Notes وبنوك الأسئلة، يستبعد المشتتات، ويكشف فارق السيناريو.</p>
    <div style="display:flex;justify-content:center;gap:12px;margin-bottom:40px">
      <a class="btn primary" href="${u ? '#/ask' : '#/register'}">${u ? 'اسأل سؤالك الحين 🩺' : 'جرّب ضيافتك مجاناً (5 أسئلة)'}</a>
      <a class="btn soft" href="#/pricing">عرض باقات الاشتراك</a>
    </div>
    <div class="card" style="max-width:760px;margin:0 auto;text-align:right">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span class="badge ok">مثال على فحص الأسئلة الخلافية</span>
        <span style="font-size:13px;color:var(--muted)">SMLE Recall 2026</span>
      </div>
      <p style="font-family:Inter,sans-serif;direction:ltr;text-align:left;margin-bottom:14px;font-size:14.5px">A 45-year-old male presents with acute severe substernal chest pain. ECG shows ST-elevation in II, III, aVF. BP 80/50. Which medication is contraindicated?</p>
      <div class="clue-box">
        <b>سر السيناريو:</b> انخفاض الضغط (BP 80/50) وتخطيط الجدار السفلي يشير لاحتشاء البطين الأيمن (RV Infarction)، لذا يُمنع إعطاء النترات (Nitroglycerin).
      </div>
    </div>
  </div>${viewFooter()}`;
}

function viewAsk(){
  const b = S.boot?.balance || {};
  return `<div style="max-width:740px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:10px">
      <div>
        <h1 style="font-size:24px;color:var(--primary);margin-bottom:4px">اسأل فيرميد</h1>
        <p style="color:var(--muted);font-size:14px;margin:0">استبعاد الخيارات الخاطئة والمطابقة مع أحدث المراجع وتحديثات الحمراني</p>
      </div>
      <div class="badge" style="font-size:13.5px;padding:6px 14px">
        رصيدك: <b style="margin:0 4px">${fmt(b.usable || 0)}</b> سؤال
      </div>
    </div>

    <div class="card" id="askCard">
      <label style="display:block;font-weight:600;font-size:13.5px;margin-bottom:8px">التخصص الطبي</label>
      <div class="chips" id="specChips">
        <button type="button" class="chip on" data-spec="General">عام / SMLE</button>
        <button type="button" class="chip" data-spec="Internal Medicine">باطنة</button>
        <button type="button" class="chip" data-spec="Surgery">جراحة</button>
        <button type="button" class="chip" data-spec="Pediatrics">أطفال</button>
        <button type="button" class="chip" data-spec="OB/GYN">نساء وتوليد</button>
        <button type="button" class="chip" data-spec="Family Medicine">طب أسرة</button>
        <button type="button" class="chip" data-spec="Emergency">طوارئ</button>
      </div>

      <div style="margin-top:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <label style="font-weight:600;font-size:13.5px">نص السؤال أو سيناريو الحالة</label>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn sm soft" id="pasteBtn">📋 لصق من الحافظة</button>
            <label class="btn sm soft" style="cursor:pointer;margin:0">
              📸 رفع صورة / ECG
              <input type="file" id="imgUpload" accept="image/*" style="display:none">
            </label>
          </div>
        </div>
        <textarea class="input" id="qText" rows="6" placeholder="الصق السؤال هنا مع خياراته (A, B, C, D)... ونحن نستبعد المشتتات ونستخرج الخيار المعتمد وتحديثات الحمراني"></textarea>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap;gap:12px">
        <div class="chips" id="modeChips">
          <button type="button" class="chip sm on" data-mode="standard">إجماع مركز للمراجعة</button>
          <button type="button" class="chip sm" data-mode="detailed">تحليل سريري تفصيلي</button>
        </div>
        <button type="button" class="btn primary" id="submitQBtn" style="min-width:170px">
          استخراج الإجابة الموثقة 🩺
        </button>
      </div>
    </div>

    <div class="card" id="waitingCard" style="display:none;text-align:center;padding:48px 24px">
      <div class="pulse-ring">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:24px;margin:0 auto 16px">🩺</div>
      </div>
      <h3 id="waitingText" style="color:var(--primary);font-size:17px;margin-bottom:8px;transition:opacity .25s">نبحث في أحدث مراجع الطب المعتمدة...</h3>
      <p style="color:var(--muted);font-size:13.5px">نطابق الخيارات ونستبعد المشتتات ونفحص تحديثات الحمراني</p>
    </div>

    <div id="resultCard" style="display:none"></div>
  </div>`;
}

function viewPricing(){
  return `<div style="max-width:840px;margin:0 auto;text-align:center">
    <div class="badge" style="margin-bottom:12px">باقات الاشتراك</div>
    <h1 style="font-size:28px;color:var(--primary);margin-bottom:8px">اختر باقتك وفالك الـ 100</h1>
    <p style="color:var(--muted);margin-bottom:28px">استثمر في جاهزيتك واكسب راحة البال قبل قاعة الاختبار</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;text-align:right">
      <div class="card lift">
        <span class="badge">التجربة السريعة</span>
        <div style="font-size:36px;font-weight:700;color:var(--primary);margin:14px 0 4px">29 <small style="font-size:14px;color:var(--muted)">ر.س</small></div>
        <p style="color:var(--muted);font-size:13.5px">25 سؤالاً سريرياً مع فحص المراجع</p>
        <button class="btn primary block checkout-btn" data-pkg="pkg_starter" style="margin-top:20px">شراء الباقة</button>
      </div>
      <div class="card lift" style="border:2px solid var(--primary)">

function bindView(path){
  if (path === 'register'){
    $('#regForm').onsubmit = async e => {
      e.preventDefault();
      const name = $('#regName').value.trim(), email = $('#regEmail').value.trim(), password = $('#regPw').value;
      const gender = document.querySelector('input[name="gender"]:checked')?.value || 'male';
      if (!name || !email || !password) return toast('يرجى تعبئة كافة الحقول', 'bad');
      const r = await api('register', { name, email, password, gender });
      if (!r.ok) return toast(r.error || 'تعذر التسجيل', 'bad');
      store.set('vm_pending_email', email);
      toast('تم التسجيل! أرسلنا رمز التحقق لبريدك ✉️', 'ok');
      location.hash = '#/verify';
    };
  }

  if (path === 'verify'){
    $('#verifyForm').onsubmit = async e => {
      e.preventDefault();
      const code = $('#otpCode').value.trim();
      const email = store.get('vm_pending_email');
      const r = await api('verifyEmail', { email, code });
      if (!r.ok) return toast(r.error || 'رمز التحقق غير صحيح', 'bad');
      S.token = r.data.token; store.set('vm_token', S.token);
      S.boot.user = r.data.user; S.boot.balance = r.data.balance;
      toast('أهلاً بك في فيرميد! تم صرف 5 أسئلة ضيافة والقهوة علينا ☕️', 'ok');
      location.hash = '#/ask';
    };
  }

  if (path === 'login'){
    $('#loginForm').onsubmit = async e => {
      e.preventDefault();
      const email = $('#logEmail').value.trim(), password = $('#logPw').value;
      const r = await api('login', { email, password });
      if (!r.ok) return toast(r.error || 'بيانات الدخول غير صحيحة', 'bad');
      if (r.data.needVerify){
        store.set('vm_pending_email', email);
        toast('يرجى تفعيل بريدك الإلكتروني أولاً');
        return location.hash = '#/verify';
      }
      S.token = r.data.token; store.set('vm_token', S.token);
      S.boot.user = r.data.user; S.boot.balance = r.data.balance;
      toast('أهلاً بك مجدداً يا دكتور/ة 🩺', 'ok');
      const aft = store.get('vm_after_login'); store.del('vm_after_login');
      location.hash = aft || '#/ask';
    };
  }

  if (path === 'forgot'){
    $('#forgotForm').onsubmit = async e => {
      e.preventDefault();
      const email = $('#forEmail').value.trim();
      const btn = $('#forgotBtn');
      btn.disabled = true; btn.textContent = 'جاري الإرسال...';
      const r = await api('requestReset', { email });
      btn.disabled = false; btn.textContent = 'إرسال رمز الاستعادة';
      if (!r.ok) return toast(r.error, 'bad');
      toast('أرسلنا رمز تعيين كلمة المرور لبريدك الإلكتروني', 'ok');
      $('#forgotStep1').style.display = 'none';
      $('#forgotStep2').style.display = 'block';
    };

    $('#resetPassForm').onsubmit = async e => {
      e.preventDefault();
      const email = $('#forEmail').value.trim();
      const code = $('#resetCode').value.trim();
      const newPassword = $('#newPass').value;
      const btn = $('#resetBtn');
      btn.disabled = true; btn.textContent = 'جاري الحفظ...';
      const r = await api('resetPassword', { email, code, newPassword });
      btn.disabled = false; btn.textContent = 'حفظ كلمة المرور والدخول';
      if (!r.ok) return toast(r.error, 'bad');
      toast('تم تعيين كلمة المرور بنجاح! يمكنك الآن تسجيل الدخول', 'ok');
      location.hash = '#/login';
    };
  }

  if (path === 'account'){
    $('#logoutBtn').onclick = () => {
      api('logout');
      S.token = null; store.del('vm_token');
      if (S.boot) S.boot.user = null;
      toast('تم تسجيل الخروج بنجاح');
      location.hash = '#/';
    };
  }

  if (path === 'pricing'){
    $$('.checkout-btn').forEach(b => {
      b.onclick = () => {
        toast('وضع الدفع التجريبي: سيتم تفعيل باقتك فور تفعيل ميسر 💳', 'ok');
      };
    });
  }

  if (path === 'ask'){
    let selectedSpec = 'General';
    let selectedMode = 'standard';
    const waitingMsgs = [
      'نبحث في أحدث مراجع الطب المعتمدة...',
      'نقارن بين الخيارات ونستبعد المشتتات...',
      'نفحص تحديثات الحمراني الأحدث...',
      'نصيغ الإجماع النهائي لسؤالك...'
    ];

    $$('#specChips .chip').forEach(b => {
      b.onclick = () => {
        $$('#specChips .chip').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        selectedSpec = b.dataset.spec;
      };
    });

    $$('#modeChips .chip').forEach(b => {
      b.onclick = () => {
        $$('#modeChips .chip').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        selectedMode = b.dataset.mode;
      };
    });

    $('#pasteBtn').onclick = async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) { $('#qText').value = text.trim(); toast('تم اللصق من الحافظة 📋', 'ok'); }
      } catch(e) {
        toast('يرجى لصق النص يدوياً في الخانة');
      }
    };

    $('#imgUpload').onchange = e => {
      const f = e.target.files[0];
      if (f) toast(`تم اختيار الصورة: ${f.name} (سيتم تحليلها سريرياً 📸)`, 'ok');
    };

    $('#submitQBtn').onclick = async () => {
      const text = ($('#qText').value || '').trim();
      if (text.length < 10) return toast('يرجى كتابة نص السؤال أو الحالة بوضوح', 'bad');

      $('#askCard').style.display = 'none';
      $('#resultCard').style.display = 'none';
      $('#waitingCard').style.display = 'block';

      let idx = 0;
      const tm = setInterval(() => {
        idx = (idx + 1) % waitingMsgs.length;
        const el = $('#waitingText');
        if (el) el.textContent = waitingMsgs[idx];
      }, 2400);

      const r = await api('askQuestion', { question: text, specialty: selectedSpec, mode: selectedMode });
      clearInterval(tm);
      $('#waitingCard').style.display = 'none';

      if (!r.ok){
        $('#askCard').style.display = 'block';
        return toast(r.error || 'تعذر الاتصال بالمحرك، رصيدك في أمان', 'bad');
      }

      if (r.data.balance) S.boot.balance = r.data.balance;
      renderResult(r.data.answer, text);
    };

    function renderResult(ans, originalQ){
      const rc = $('#resultCard');
      const cheer = ans.cheer || (user()?.gender === 'female' ? 'وفالك الـ 100 يا دكتورة 🩺' : 'وفالك الـ 100 يا دكتور 🩺');

      let consensusHtml = '';
      if (Array.isArray(ans.consensus_table) && ans.consensus_table.length > 0) {
        consensusHtml = `<table class="tbl" style="margin-top:14px">
          <thead><tr><th>المصدر / المرجع</th><th>الخيار المعتمد</th><th>السيناريو الأصلي</th></tr></thead>
          <tbody>
            ${ans.consensus_table.map((c, i) => `<tr>
              <td style="font-weight:600">${esc(c.source)}</td>
              <td>${esc(c.recommendation || c.choice || 'معتمد')}</td>
              <td>
                <button class="btn sm soft view-scenario-btn" data-bank="${esc(c.source)}" data-text="${esc(c.sample_scenario || originalQ)}" data-clue="${esc(c.key_clue || 'المتغير الأساسي: الحالة السريرية واستقرار العلامات الحيوية')}" style="padding:4px 10px;font-size:12px">
                  The Case Scenario 🔍
                </button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>`;
      }

      rc.innerHTML = `<div class="card" style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span class="badge ok">الخيار المعتمد سريرياً ✓</span>
          <button class="btn sm soft" id="copyCaseBtn">📋 نسخ ملخص الحالة</button>
        </div>

        <h2 style="font-size:22px;color:var(--primary);margin-bottom:12px">${esc(ans.verified_answer || 'الخيار الصحيح')}</h2>
        
        <div class="clue-box">
          <b>التعليل واستبعاد المشتتات:</b>
          <div style="margin-top:4px">${esc(ans.reasoning || '')}</div>
        </div>

        <div style="margin-top:16px">
          <h4 style="font-size:14.5px;color:var(--text);margin-bottom:6px">مقارنة المراجع وبنوك الأسئلة وتحديثات الحمراني:</h4>
          ${consensusHtml}
        </div>

        ${ans.high_yield_pearl ? `<div class="pearl-box">
          <b style="color:var(--primary)">⭐ درّة الاختبار (High-Yield Pearl):</b>
          <p style="margin:4px 0 0;font-size:13.5px">${esc(ans.high_yield_pearl)}</p>
        </div>` : ''}

        <div style="text-align:center;margin:20px 0 10px;font-size:16px;font-weight:700;color:var(--primary)">
          ${esc(cheer)}
        </div>

        <div class="actions-row" style="justify-content:center;border-top:1px solid var(--line);padding-top:16px">
          <button class="btn soft" id="downloadCardBtn">📸 تحميل البطاقة كصورة</button>
          <a class="btn soft" href="https://t.me/Verimed_App_bot" target="_blank">💬 أبلغنا بملاحظة عبر تيليجرام</a>
          <button class="btn primary" id="newQuestionBtn">طرح سؤال آخر</button>
        </div>
      </div>`;

      rc.style.display = 'block';

      $$('.view-scenario-btn').forEach(btn => {
        btn.onclick = () => {
          $('#modalBankName').textContent = btn.dataset.bank;
          $('#modalScenarioText').textContent = btn.dataset.text;
          $('#modalClueBox').innerHTML = `<b>سر الاختلاف والكلمة المفتاحية:</b> ${esc(btn.dataset.clue)}`;
          $('#scenarioModal').classList.add('open');
        };
      });

      $('#copyCaseBtn').onclick = () => {
        const txt = `🩺 *سؤال SMLE — فيرميد (The Verified Answer)*\n\n` +
          `❓ *الحالة السريرية:*\n${originalQ}\n\n` +
          `✅ *الخيار المعتمد:*\n${ans.verified_answer}\n\n` +
          `💡 *التعليل:*\n${ans.reasoning}\n\n` +
          `✨ وفالك الـ 100 | theverimed.github.io`;
        navigator.clipboard.writeText(txt);
        toast('تم نسخ ملخص الحالة للمشاركة 📋', 'ok');
      };

      $('#downloadCardBtn').onclick = () => toast('جاري إنشاء وتحميل بطاقة الستوري 📸', 'ok');

      $('#newQuestionBtn').onclick = () => {
        $('#qText').value = '';
        rc.style.display = 'none';
        $('#askCard').style.display = 'block';
      };
    }
  }
}

$('#closeModalBtn').onclick = () => $('#scenarioModal').classList.remove('open');
$('#closeModalBtn2').onclick = () => $('#scenarioModal').classList.remove('open');

async function init(){
  const r = await api('bootstrap');
  if (r.ok) {
    S.boot = r.data;
    if (r.data.sessionExpired) store.del('vm_token');
  }
  render();
}
init();
</script>
